name: Update tank levels

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can run a
    # little late under load, but averages out close to this.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Read tank levels
        env:
          TANKLEVELS_USERNAME: ${{ secrets.TANKLEVELS_USERNAME }}
          TANKLEVELS_PASSWORD: ${{ secrets.TANKLEVELS_PASSWORD }}
        run: python scrape.py

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failure
          path: |
            debug_failure.png
            debug_login_failed.png
          if-no-files-found: ignore

      - name: Commit updated data.json
        run: |
          git config user.name "tank-level-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update tank levels"
          git push
